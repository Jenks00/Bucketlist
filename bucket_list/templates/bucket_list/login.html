{% extends 'bucket_list/main.html' %}

{% block title %}Sign in · The Bucket List{% endblock %}

{% block content %}

<div class="card card--narrow">
    <h2 class="text-center">Welcome back</h2>
    <p class="subtitle text-center" style="color: var(--color-text-muted); margin-bottom: 1.5rem;">Sign in to pick up where you left off.</p>
    <form action="" method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        <p class="form-footnote">Don't have an account yet? <a href="{% url 'register' %}">Create one</a></p>
    </form>
</div>

{% endblock content %}
