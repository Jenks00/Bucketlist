{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}The Bucket List{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'bucket_list/css/style.css' %}">
</head>
<body>
    <div class="page">
        <header class="site-header">
            <a class="brand" href="{% url 'task' %}">
                <span class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M5 13l4 4L19 7" />
                    </svg>
                </span>
                The Bucket List
            </a>
            {% if request.user.is_authenticated %}
            <form class="logout-form" method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="link-button">Sign out</button>
            </form>
            {% endif %}
        </header>

        <main class="content">
            {% block content %}
            {% endblock content %}
        </main>

        <footer class="site-footer">
            <p>A quiet place to keep the promises you make to yourself.</p>
        </footer>
    </div>
</body>
</html>
