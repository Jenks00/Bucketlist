{% extends 'bucket_list/main.html' %}

{% block title %}Delete item · The Bucket List{% endblock %}

{% block content %}

<a class="back-link" href="{% url 'task' %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M15 18l-6-6 6-6" />
    </svg>
    Back to list
</a>

<div class="card card--narrow">
    <h2>Remove this item?</h2>
    <p class="confirm-copy">Are you sure you want to delete <b>{{ task }}</b>? This cannot be undone.</p>
    <form action="" method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button class="btn btn-danger" type="submit">Yes, delete it</button>
            <a class="btn btn-secondary" href="{% url 'task' %}">Cancel</a>
        </div>
    </form>
</div>

{% endblock content %}
